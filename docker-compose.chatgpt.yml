services:
  agentdock:
    environment:
      # Public ChatGPT custom MCP deployments should use AgentDock OAuth.
      AGENTDOCK_OAUTH_ENABLED: "true"
      AGENTDOCK_SERVER_URL: "${AGENTDOCK_SERVER_URL:?set AGENTDOCK_SERVER_URL to the public HTTPS origin}"
      AGENTDOCK_OAUTH_PASSWORD: "${AGENTDOCK_OAUTH_PASSWORD:?set AGENTDOCK_OAUTH_PASSWORD (12+ characters)}"
      AGENTDOCK_OAUTH_TOKEN_SECRET: "${AGENTDOCK_OAUTH_TOKEN_SECRET:?set AGENTDOCK_OAUTH_TOKEN_SECRET (32+ bytes)}"
      AGENTDOCK_OAUTH_ACCESS_TOKEN_TTL: "${AGENTDOCK_OAUTH_ACCESS_TOKEN_TTL:-1h}"
